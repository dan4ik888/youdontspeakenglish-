name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK уже предустановлен на ubuntu-latest (ANDROID_HOME задан,
      # лицензии приняты) — отдельный setup не нужен.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: english-magistratura-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Кладём APK в отдельную ветку apk-output, чтобы его можно было забрать
      # через GitHub API (артефакты отдаются через заблокированное хранилище).
      - name: Publish APK to apk-output branch
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/app-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-output
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p dist
          cp /tmp/app-debug.apk dist/app-debug.apk
          git add -f dist/app-debug.apk
          git commit -m "APK output for ${GITHUB_SHA}"
          git push -f origin apk-output

  # Проверка на настоящем Android-эмуляторе (Android 14 / API 34)
  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: english-magistratura-apk
          path: apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Accept Android licenses (best effort)
        run: |
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          [ -n "$SDKM" ] && (yes | "$SDKM" --licenses > /dev/null 2>&1 || true)

      - name: Install test deps
        run: pip install websocket-client

      - name: Run app on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          force-avd-creation: false
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 ci/emulator_test.py

      - name: Publish test results to test-output branch
        if: always()
        run: |
          mkdir -p /tmp/res
          cp -r test-out/. /tmp/res/ 2>/dev/null || echo "no results" > /tmp/res/NO_RESULTS.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan test-output
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r /tmp/res/. ./
          git add -A
          git commit -m "Emulator test results for ${GITHUB_SHA}" || true
          git push -f origin test-output
