name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Android SDK уже предустановлен на ubuntu-latest (ANDROID_HOME задан,
      # лицензии приняты) — отдельный setup не нужен.
      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: english-magistratura-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # Кладём APK в отдельную ветку apk-output, чтобы его можно было забрать
      # через GitHub API (артефакты отдаются через заблокированное хранилище).
      - name: Publish APK to apk-output branch
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk /tmp/app-debug.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout --orphan apk-output
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p dist
          cp /tmp/app-debug.apk dist/app-debug.apk
          git add -f dist/app-debug.apk
          git commit -m "APK output for ${GITHUB_SHA}"
          git push -f origin apk-output
