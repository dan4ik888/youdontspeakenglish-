plugins {
    id 'com.android.application'
}

android {
    namespace 'kz.magistratura.english'
    compileSdk 34

    defaultConfig {
        applicationId 'kz.magistratura.english'
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName '1.1'
    }

    // Постоянный ключ debug-подписи: без него каждая сборка на GitHub получает
    // случайный ключ, и новая версия не ставится поверх старой.
    // Это debug-ключ (пароль стандартный). Для Google Play нужен отдельный
    // приватный release-ключ, который в репозиторий не кладут.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
