<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0;font:14px system-ui}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>English для магистратуры</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: app shell with sticky appbar + scrolling tab nav, card-based views.
     Palette grounded in Kazakhstan (sky-blue primary, warm gold accent) on cool neutrals. */
  :root{
    --bg:#eef2f7; --surface:#ffffff; --surface-2:#f5f8fc; --fg:#0f1b2d; --muted:#5c6b82;
    --border:#dbe3ee; --primary:#0b6fb4; --primary-soft:#e2f0fb; --accent:#e0981a;
    --good:#1a9c57; --good-soft:#e2f6ec; --bad:#d8453b; --bad-soft:#fbe7e5;
    --ring:#0b6fb4; --shadow:0 1px 2px rgba(16,34,56,.06),0 8px 24px rgba(16,34,56,.07);
    --r:14px; --r-sm:10px;
    --font:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    --display:"Space Grotesk",var(--font);
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --bg:#0a1220; --surface:#121d30; --surface-2:#0f1829; --fg:#e8eef7; --muted:#93a3bd;
    --border:#243247; --primary:#4db6ec; --primary-soft:#122c42; --accent:#f0b64a;
    --good:#3fc27e; --good-soft:#102a1f; --bad:#f06a60; --bad-soft:#2c1512;
    --ring:#4db6ec; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#0a1220; --surface:#121d30; --surface-2:#0f1829; --fg:#e8eef7; --muted:#93a3bd;
    --border:#243247; --primary:#4db6ec; --primary-soft:#122c42; --accent:#f0b64a;
    --good:#3fc27e; --good-soft:#102a1f; --bad:#f06a60; --bad-soft:#2c1512;
    --ring:#4db6ec; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.55;
    -webkit-font-smoothing:antialiased;letter-spacing:-.005em}
  h1,h2,h3,.brand-name{font-family:var(--display);letter-spacing:-.02em;text-wrap:balance}
  button{font-family:inherit;cursor:pointer;color:inherit}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);
    background:var(--surface);z-index:40}

  /* ---------- App bar ---------- */
  .appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
  .appbar-row{display:flex;align-items:center;gap:12px;max-width:1040px;margin:0 auto;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:10px}
  .brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
  .logo{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;
    background:linear-gradient(145deg,var(--primary),#0a5c96);color:#fff;font-family:var(--display);
    font-weight:700;font-size:16px;box-shadow:0 2px 8px rgba(11,111,180,.35)}
  .brand-name{font-weight:600;font-size:16px;line-height:1.1}
  .brand-sub{font-size:11.5px;color:var(--muted);line-height:1.1;margin-top:1px}
  .icon-btn{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);
    background:var(--surface-2);display:grid;place-items:center;flex:none}
  .icon-btn:hover{border-color:var(--primary)}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;
    padding:7px 11px;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);
    color:var(--muted);white-space:nowrap}
  .chip b{color:var(--accent);font-variant-numeric:tabular-nums}

  /* ---------- Tabs ---------- */
  .tabs{background:var(--surface);border-bottom:1px solid var(--border);overflow-x:auto;
    -webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs-inner{display:flex;gap:2px;max-width:1040px;margin:0 auto;
    padding-left:max(10px,env(safe-area-inset-left,0px));padding-right:max(10px,env(safe-area-inset-right,0px))}
  .tab{flex:none;display:flex;align-items:center;gap:7px;border:none;background:none;
    padding:12px 13px;font-size:13.5px;font-weight:600;color:var(--muted);
    border-bottom:2.5px solid transparent;white-space:nowrap}
  .tab svg{width:17px;height:17px}
  .tab:hover{color:var(--fg)}
  .tab.active{color:var(--primary);border-bottom-color:var(--primary)}

  /* ---------- Main ---------- */
  .main{max-width:1040px;margin:0 auto;
    padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
    padding-block:22px 64px}
  .view{animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion:reduce){.view,.card{animation:none}}

  .page-title{font-size:23px;font-weight:600;margin:0 0 3px}
  .page-sub{color:var(--muted);font-size:14px;margin:0 0 20px}
  .section-label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--muted);margin:26px 0 12px}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);
    box-shadow:var(--shadow)}
  .pad{padding:18px}

  /* ---------- Home ---------- */
  .hero{background:linear-gradient(145deg,var(--primary),#084e80);color:#fff;border:none;
    border-radius:18px;padding:22px;position:relative;overflow:hidden}
  .hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;
    border-radius:50%;background:radial-gradient(circle,rgba(224,152,26,.5),transparent 70%)}
  .hero h2{font-size:21px;margin:0 0 6px;color:#fff;position:relative}
  .hero p{margin:0 0 16px;font-size:13.5px;opacity:.92;max-width:40ch;position:relative}
  .hero-stats{display:flex;gap:22px;position:relative;flex-wrap:wrap}
  .hero-stat .n{font-family:var(--display);font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
  .hero-stat .l{font-size:11.5px;opacity:.85}
  .ring-wrap{display:flex;align-items:center;gap:16px}
  .ring{--p:0;width:80px;height:80px;flex:none;border-radius:50%;display:grid;place-items:center;
    background:conic-gradient(var(--accent) calc(var(--p)*1%),rgba(255,255,255,.22) 0)}
  .ring span{width:62px;height:62px;border-radius:50%;background:var(--primary);display:grid;
    place-items:center;font-family:var(--display);font-weight:700;font-size:18px}

  .grid{display:grid;gap:12px}
  .grid.two{grid-template-columns:repeat(2,1fr)}
  .grid.auto{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  @media (max-width:560px){.grid.auto{grid-template-columns:repeat(2,1fr)}}

  .stat-tile{padding:15px}
  .stat-tile .n{font-family:var(--display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .stat-tile .l{font-size:12.5px;color:var(--muted);margin-top:2px}

  .act{display:flex;align-items:center;gap:13px;padding:15px;text-align:left;width:100%;
    border:1px solid var(--border);background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
  .act:hover{border-color:var(--primary);transform:translateY(-1px);transition:.15s}
  .act .ai{width:42px;height:42px;border-radius:11px;flex:none;display:grid;place-items:center;
    background:var(--primary-soft);color:var(--primary)}
  .act .at{font-weight:600;font-size:15px}
  .act .ad{font-size:12.5px;color:var(--muted);margin-top:1px}
  .act .arr{margin-left:auto;color:var(--muted)}

  /* ---------- Topic list ---------- */
  .topic{display:flex;align-items:center;gap:14px;padding:15px;width:100%;text-align:left;
    border:1px solid var(--border);background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
  .topic:hover{border-color:var(--primary);transform:translateY(-1px);transition:.15s}
  .topic .tnum{width:34px;height:34px;border-radius:9px;flex:none;display:grid;place-items:center;
    font-family:var(--display);font-weight:700;font-size:13px;background:var(--surface-2);color:var(--muted)}
  .topic .tt{font-weight:600;font-size:15px;min-width:0}
  .topic .ts{font-size:12.5px;color:var(--muted)}
  .topic .tcat{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    color:var(--accent)}
  .mastery{margin-left:auto;text-align:right;flex:none;width:64px}
  .bar{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:5px}
  .bar i{display:block;height:100%;background:var(--good);border-radius:999px}
  .mastery .mv{font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}

  /* ---------- Quiz ---------- */
  .quiz-head{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .back{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;
    color:var(--muted);background:none;border:none;padding:6px 2px}
  .back:hover{color:var(--primary)}
  .progress-line{height:7px;border-radius:999px;background:var(--surface-2);overflow:hidden;flex:1;min-width:120px}
  .progress-line i{display:block;height:100%;background:var(--primary);transition:width .3s}
  .qcount{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}

  .qcard{padding:22px}
  .qmeta{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .pill{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
    padding:4px 9px;border-radius:999px;background:var(--primary-soft);color:var(--primary)}
  .pill.gold{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent)}
  .qtext{font-size:19px;font-weight:600;line-height:1.5;margin:0 0 18px}
  .qtext .gap{color:var(--primary);font-weight:700;border-bottom:2px dashed var(--primary);padding:0 2px}
  .opts{display:grid;gap:9px}
  .opt{display:flex;align-items:center;gap:12px;padding:14px 15px;border:1.5px solid var(--border);
    background:var(--surface);border-radius:var(--r-sm);font-size:15.5px;text-align:left;width:100%;
    transition:.12s}
  .opt:not(:disabled):hover{border-color:var(--primary);background:var(--surface-2)}
  .opt .letter{width:26px;height:26px;border-radius:7px;flex:none;display:grid;place-items:center;
    font-weight:700;font-size:13px;background:var(--surface-2);color:var(--muted);font-family:var(--display)}
  .opt.correct{border-color:var(--good);background:var(--good-soft)}
  .opt.correct .letter{background:var(--good);color:#fff}
  .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
  .opt.wrong .letter{background:var(--bad);color:#fff}
  .opt.chosen{border-color:var(--primary);background:var(--primary-soft)}
  .opt.chosen .letter{background:var(--primary);color:#fff}
  .opt .mark{margin-left:auto;font-weight:700;font-size:13px}

  .explain{margin-top:15px;padding:14px 15px;border-radius:var(--r-sm);font-size:14px;
    background:var(--surface-2);border:1px solid var(--border);display:none}
  .explain.show{display:block;animation:fade .2s}
  .explain .et{font-weight:700;font-size:12px;letter-spacing:.05em;text-transform:uppercase;
    margin-bottom:5px;display:flex;align-items:center;gap:6px}
  .explain.ok .et{color:var(--good)} .explain.no .et{color:var(--bad)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;
    border-radius:var(--r-sm);border:none;font-weight:600;font-size:15px;background:var(--primary);
    color:#fff;box-shadow:0 4px 14px rgba(11,111,180,.3)}
  .btn:hover{filter:brightness(1.06)} .btn:disabled{opacity:.45;box-shadow:none;cursor:default}
  .btn.ghost{background:var(--surface);color:var(--fg);border:1.5px solid var(--border);box-shadow:none}
  .btn.ghost:hover{border-color:var(--primary);filter:none}
  .btn.gold{background:var(--accent);box-shadow:0 4px 14px rgba(224,152,26,.3)}
  .btn.block{width:100%}
  .quiz-foot{display:flex;gap:10px;margin-top:18px;align-items:center}

  /* ---------- Theory ---------- */
  .theory{font-size:15px;line-height:1.7}
  .theory p{margin:0 0 12px}
  .theory h3{font-size:16px;margin:20px 0 8px;color:var(--primary)}
  .theory ul{margin:0 0 12px;padding-left:20px} .theory li{margin-bottom:6px}
  .theory .ex{background:var(--surface-2);border-left:3px solid var(--accent);padding:10px 14px;
    border-radius:0 8px 8px 0;margin:0 0 12px;font-size:14.5px}
  .theory .ex em{color:var(--muted);font-style:normal}
  .theory code{background:var(--surface-2);padding:1px 6px;border-radius:5px;font-size:13.5px;
    color:var(--accent);font-weight:600}
  .en{font-weight:600}

  /* ---------- Exam ---------- */
  .exam-bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
  .timer{display:inline-flex;align-items:center;gap:7px;font-family:var(--display);font-weight:700;
    font-size:17px;font-variant-numeric:tabular-nums;padding:8px 14px;border-radius:10px;
    background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow)}
  .timer.warn{color:var(--bad);border-color:var(--bad)}
  .navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:7px;margin-top:4px}
  .navg{aspect-ratio:1;border-radius:8px;border:1.5px solid var(--border);background:var(--surface);
    font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;display:grid;place-items:center}
  .navg:hover{border-color:var(--primary)}
  .navg.done{background:var(--primary-soft);border-color:var(--primary);color:var(--primary)}
  .navg.cur{outline:2px solid var(--primary);outline-offset:1px}
  .navg.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
  .navg.bad{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}

  .result-score{text-align:center;padding:26px 18px}
  .result-score .big{font-family:var(--display);font-size:52px;font-weight:700;line-height:1;
    font-variant-numeric:tabular-nums}
  .result-score .outof{font-size:22px;color:var(--muted)}
  .verdict{display:inline-block;margin-top:12px;padding:7px 16px;border-radius:999px;font-weight:700;font-size:14px}
  .verdict.pass{background:var(--good-soft);color:var(--good)}
  .verdict.fail{background:var(--bad-soft);color:var(--bad)}

  /* ---------- Vocab flashcards ---------- */
  .flash{perspective:1200px;height:230px;margin:0 auto;max-width:430px}
  .flash-inner{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
  .flash.flipped .flash-inner{transform:rotateY(180deg)}
  .flash-face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:26px;
    background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow);text-align:center}
  .flash-back{transform:rotateY(180deg);background:var(--primary-soft)}
  .flash .w{font-family:var(--display);font-size:27px;font-weight:700}
  .flash .pos{font-size:12px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  .flash .ru{font-size:22px;font-weight:600}
  .flash .ex{font-size:14px;color:var(--muted);font-style:italic;max-width:34ch}
  .flash .hint{font-size:12px;color:var(--muted);margin-top:6px}

  .empty{text-align:center;color:var(--muted);padding:40px 18px;font-size:14.5px}
  .mini-list{display:grid;gap:8px}
  .mini{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--border);
    border-radius:var(--r-sm);background:var(--surface);font-size:14px}
  .mini .d{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:3px}
  .seg button{border:none;background:none;padding:7px 13px;border-radius:7px;font-size:13px;font-weight:600;color:var(--muted)}
  .seg button.on{background:var(--surface);color:var(--primary);box-shadow:var(--shadow)}
  .foot-note{text-align:center;color:var(--muted);font-size:12px;margin-top:34px;line-height:1.6}
</style>

<header class="appbar">
  <div class="appbar-row">
    <div class="brand">
      <div class="logo">EN</div>
      <div style="min-width:0">
        <div class="brand-name">English для магистратуры</div>
        <div class="brand-sub">Подготовка к КТ · английский язык · РК</div>
      </div>
    </div>
    <span class="chip" id="streakChip" title="Серия дней подряд">🔥 <b id="streakN">0</b></span>
    <button class="icon-btn" id="themeBtn" aria-label="Сменить тему"></button>
  </div>
  <nav class="tabs"><div class="tabs-inner" id="tabs"></div></nav>
</header>
<main class="main"><div id="app"></div></main>

<script>
"use strict";
/* =======================================================================
   ДАННЫЕ
   ======================================================================= */
const TOPICS=[{"id": "present", "cat": "Грамматика", "title": "Present Tenses", "ru": "Настоящие времена", "theory": ["\n<p>💡 <b>Суть:</b> в английском «настоящее» — это не одно время, а несколько. Англичанину важно различать: это <b>вообще/всегда</b>, это <b>прямо сейчас</b>, или это <b>уже случилось и важен результат</b>.</p>\n<h3>1. Вообще, всегда, по привычке</h3>\n<p>Факт, расписание, то что делаешь регулярно. Глагол просто так. Но для <code>he / she / it</code> добавляем <code>-s</code>.</p>\n<div class='ex'><span class='en'>I work in a bank.</span> — <em>Я работаю в банке (вообще, это моя работа).</em></div>\n<div class='ex'><span class='en'>She works every day.</span> — <em>Она работает каждый день. (он/она → work+s)</em></div>\n<h3>2. Прямо сейчас, в этот момент</h3>\n<p>Формула: <code>am / is / are + глагол-ing</code>. Сигналы: <span class='en'>now, look!, listen!</span></p>\n<div class='ex'><span class='en'>Look! It is raining.</span> — <em>Смотри! (сейчас) идёт дождь.</em></div>\n<h3>3. Уже сделал — и это важно сейчас</h3>\n<p>Формула: <code>have / has + 3-я форма глагола</code>. Тут неважно КОГДА, важно что есть результат ПРЯМО СЕЙЧАС.</p>\n<div class='ex'><span class='en'>I have lost my keys.</span> — <em>Я потерял ключи (а сейчас их нет — вот результат).</em></div>\n<h3>4. Делаю уже сколько-то времени</h3>\n<p><code>have / has been + глагол-ing</code>. Подчёркиваем, что действие тянется.</p>\n<div class='ex'><span class='en'>I have been working all day.</span> — <em>Я работаю весь день (и вымотался).</em></div>\n<p>👉 <b>Как не путать:</b> «каждый день / обычно» → первое. «Сейчас» → второе. «Уже / только что / сколько раз» → третье.</p>\n"]}, {"id": "past", "cat": "Грамматика", "title": "Past Tenses", "ru": "Прошедшие времена", "theory": ["\n<p>💡 <b>Суть:</b> прошлое тоже делится по смыслу: просто <b>сделал и всё</b>, <b>делал в процессе</b>, или <b>сделал ещё раньше другого прошлого</b>.</p>\n<h3>1. Просто случилось в прошлом</h3>\n<p>Есть точное «когда»: <span class='en'>yesterday, last year, in 2010, ago</span>. Правильные глаголы: +<code>ed</code>. Неправильные — учим (go→went, see→saw).</p>\n<div class='ex'><span class='en'>We went to Turkey last summer.</span> — <em>Прошлым летом мы ездили в Турцию.</em></div>\n<h3>2. Было в процессе (фон)</h3>\n<p><code>was / were + глагол-ing</code>. Что-то длилось, и тут бац — случилось другое.</p>\n<div class='ex'><span class='en'>I was watching TV when the lights went out.</span> — <em>Я смотрел телевизор (процесс), когда вырубился свет.</em></div>\n<h3>3. Ещё раньше прошлого</h3>\n<p><code>had + 3-я форма</code>. Было два события в прошлом — то, что раньше, ставим в это.</p>\n<div class='ex'><span class='en'>By the time we arrived, the film had started.</span> — <em>Когда мы пришли, фильм уже начался (начался РАНЬШЕ, чем пришли).</em></div>\n<p>👉 <b>used to</b> — то, что было раньше, но больше нет: <span class='en'>He used to smoke.</span> — <em>Раньше он курил (сейчас нет).</em></p>\n"]}, {"id": "future", "cat": "Грамматика", "title": "Future Forms", "ru": "Способы выражения будущего", "theory": ["\n<p>💡 <b>Суть:</b> «будущее» можно сказать разными способами, и выбор зависит от того, <b>решил ты прямо сейчас</b>, <b>запланировал заранее</b> или это <b>расписание</b>.</p>\n<h3>will — решил сейчас / прогноз</h3>\n<p>Думаешь, обещаешь, или решил прямо в момент разговора.</p>\n<div class='ex'><span class='en'>The phone is ringing. — I'll get it.</span> — <em>Телефон звонит. — Я возьму (решил сейчас).</em></div>\n<h3>be going to — уже планировал</h3>\n<p>Намерение, которое было ДО разговора, или прогноз по явным признакам.</p>\n<div class='ex'><span class='en'>Look at the clouds! It is going to rain.</span> — <em>Глянь на тучи! Будет дождь (видно же).</em></div>\n<div class='ex'><span class='en'>I'm going to buy a car.</span> — <em>Я собираюсь купить машину (давно решил).</em></div>\n<h3>сейчас-время (-ing) — договорённость</h3>\n<p>Конкретная встреча на время: <span class='en'>I'm meeting him at 5.</span> — <em>Я встречаюсь с ним в 5 (договорились).</em></p>\n<h3>простое время — расписание</h3>\n<p><span class='en'>The train leaves at 6.</span> — <em>Поезд уходит в 6 (по расписанию).</em></p>\n<p>👉 <b>Коротко:</b> решил сейчас → <code>will</code>. Планировал → <code>going to</code>.</p>\n"]}, {"id": "articles", "cat": "Грамматика", "title": "Articles", "ru": "Артикли a / an / the", "theory": ["\n<p>💡 <b>Суть:</b> артикль — это маленькое словечко перед существительным, которого в русском нет. Оно показывает: это <b>что-то одно из многих / впервые</b> (a/an) или <b>конкретное, то самое</b> (the).</p>\n<h3>a / an — «какой-то один, впервые»</h3>\n<p>Ставим перед предметом, который можно посчитать, когда говорим о нём впервые или вообще. <code>an</code> — если слово начинается с гласного ЗВУКА.</p>\n<div class='ex'><span class='en'>I see a dog.</span> — <em>Я вижу (какую-то) собаку.</em></div>\n<div class='ex'><span class='en'>She is an engineer.</span> — <em>Она инженер. (an — перед гласным)</em></div>\n<h3>the — «то самое, конкретное»</h3>\n<p>Собеседник понимает, о чём именно речь: уже упоминали, оно единственное, или самое-самое.</p>\n<div class='ex'><span class='en'>The sun is bright.</span> — <em>Солнце яркое (оно одно).</em></div>\n<div class='ex'><span class='en'>He is the best student.</span> — <em>Он лучший ученик (конкретно самый).</em></div>\n<h3>ничего не ставим</h3>\n<p>Перед едой, спортом, языками и перед «вещами вообще» во множественном.</p>\n<div class='ex'><span class='en'>I had breakfast. I play football.</span> — <em>Я позавтракал. Я играю в футбол.</em></div>\n<p>👉 <b>Лайфхак:</b> можешь мысленно сказать «тот самый»? → ставь <code>the</code>. «Какой-то один»? → <code>a/an</code>.</p>\n"]}, {"id": "prep", "cat": "Грамматика", "title": "Prepositions", "ru": "Предлоги", "theory": ["\n<p>💡 <b>Суть:</b> предлоги (in, on, at...) в английском не переводятся один-в-один с русскими. Их проще запоминать <b>картинками</b> и <b>готовыми парами слов</b>.</p>\n<h3>Время: at / on / in — от точного к общему</h3>\n<ul><li><code>at</code> — точное время: <span class='en'>at 5 o'clock</span></li><li><code>on</code> — день: <span class='en'>on Monday</span></li><li><code>in</code> — месяц/год/часть дня: <span class='en'>in July, in 2020, in the morning</span></li></ul>\n<h3>Место: at / on / in — точка / поверхность / внутри</h3>\n<ul><li><code>at</code> — точка: <span class='en'>at the door</span> (у двери)</li><li><code>on</code> — на поверхности: <span class='en'>on the table</span> (на столе)</li><li><code>in</code> — внутри: <span class='en'>in the box</span> (в коробке)</li></ul>\n<h3>Пары, которые просто учат наизусть</h3>\n<div class='ex'><span class='en'>good at</span> (хорош в), <span class='en'>interested in</span> (интересуешься), <span class='en'>afraid of</span> (боишься), <span class='en'>depend on</span> (зависишь от)</div>\n<p>👉 Эти пары — как слова: <span class='en'>interested</span> почти всегда тащит за собой <code>in</code>. Запоминай сразу вместе.</p>\n"]}, {"id": "modals", "cat": "Грамматика", "title": "Modal Verbs", "ru": "Модальные глаголы", "theory": ["\n<p>💡 <b>Суть:</b> модальные глаголы — это слова-«приправы» (can, must, should...), которые показывают <b>можно / нужно / нельзя / наверное</b>. После них глагол всегда голый, без <code>to</code> и без <code>-s</code>.</p>\n<ul>\n<li><code>can / could</code> — умею, могу: <span class='en'>I can swim.</span></li>\n<li><code>must</code> — надо (сам считаю нужным) / <code>have to</code> — надо (правило, обстоятельства)</li>\n<li><code>mustn't</code> — <b>нельзя, запрещено</b></li>\n<li><code>needn't / don't have to</code> — не обязательно (можно и не делать)</li>\n<li><code>should</code> — стоит, советую</li>\n<li><code>may / might</code> — возможно, может быть</li>\n</ul>\n<div class='ex'><span class='en'>You mustn't smoke here.</span> — <em>Здесь нельзя курить.</em></div>\n<div class='ex'><span class='en'>You should see a doctor.</span> — <em>Тебе стоит сходить к врачу (совет).</em></div>\n<h3>Догадка (вот это путают)</h3>\n<ul><li><code>must be</code> — наверняка так (уверен): <span class='en'>He must be rich.</span> — <em>Он точно богатый.</em></li>\n<li><code>can't be</code> — не может такого быть: <span class='en'>That can't be true.</span> — <em>Это не может быть правдой.</em></li></ul>\n"]}, {"id": "cond", "cat": "Грамматика", "title": "Conditionals", "ru": "Условные предложения", "theory": ["\n<p>💡 <b>Суть:</b> это предложения с «если». Всё решает <b>насколько это реально</b>: правда всегда, может случиться, или уже невозможно.</p>\n<h3>Всегда правда (закон природы)</h3>\n<p>если + настоящее, настоящее.</p>\n<div class='ex'><span class='en'>If you heat ice, it melts.</span> — <em>Если нагреть лёд, он тает (всегда так).</em></div>\n<h3>Реально может быть (в будущем)</h3>\n<p>если + настоящее, <code>will</code> + глагол.</p>\n<div class='ex'><span class='en'>If it rains, we will stay home.</span> — <em>Если пойдёт дождь, останемся дома.</em></div>\n<h3>Мечта / нереально сейчас</h3>\n<p>если + прошедшее, <code>would</code> + глагол. По-русски это «если бы».</p>\n<div class='ex'><span class='en'>If I were rich, I would travel.</span> — <em>Был бы я богат — путешествовал бы (но я не богат).</em></div>\n<h3>Уже поздно, сожаление о прошлом</h3>\n<p>если + <code>had</code>+3-я форма, <code>would have</code>+3-я форма.</p>\n<div class='ex'><span class='en'>If she had studied, she would have passed.</span> — <em>Если бы она училась, сдала бы (но не училась и не сдала).</em></div>\n<p>👉 <b>Фишка:</b> чем нереальнее — тем «дальше в прошлое» уходит глагол.</p>\n"]}, {"id": "passive", "cat": "Грамматика", "title": "Passive Voice", "ru": "Пассивный залог", "theory": ["\n<p>💡 <b>Суть:</b> это когда <b>действие делают НАД предметом</b>, а кто сделал — неважно или неизвестно. По-русски: «дом построили», «на английском говорят».</p>\n<p>Формула простая: <b>форма be + 3-я форма глагола</b>. Меняется только <code>be</code> (по времени).</p>\n<ul>\n<li>сейчас: <span class='en'>is / are made</span> — делают</li>\n<li>в прошлом: <span class='en'>was / were made</span> — сделали</li>\n<li>будет: <span class='en'>will be made</span> — сделают</li>\n<li>уже: <span class='en'>has been made</span> — уже сделано</li>\n</ul>\n<div class='ex'><span class='en'>English is spoken everywhere.</span> — <em>На английском говорят везде (кто — неважно).</em></div>\n<div class='ex'><span class='en'>The house was built in 1990.</span> — <em>Дом построили в 1990.</em></div>\n<p>👉 Если хочешь сказать, КТО сделал — добавь <code>by</code>: <span class='en'>caught by the police</span> — <em>пойман полицией.</em></p>\n"]}, {"id": "reported", "cat": "Грамматика", "title": "Reported Speech", "ru": "Косвенная речь", "theory": ["\n<p>💡 <b>Суть:</b> это когда ты <b>пересказываешь чужие слова</b>: не «Он сказал: я устал», а «Он сказал, что устал». При пересказе время как бы «отодвигается в прошлое».</p>\n<h3>Правило сдвига</h3>\n<ul><li>сейчас → прошедшее (<span class='en'>am → was</span>)</li><li>прошедшее → ещё дальше (<span class='en'>did → had done</span>)</li><li><span class='en'>will → would, can → could</span></li></ul>\n<div class='ex'>«I am tired» → <span class='en'>He said he was tired.</span> — <em>Он сказал, что устал.</em></div>\n<h3>Вопросы пересказываем прямым порядком</h3>\n<p>Без переворота слов, как в обычном предложении.</p>\n<div class='ex'>«Where do you live?» → <span class='en'>She asked where I lived.</span> — <em>Она спросила, где я живу.</em></div>\n<h3>Просьбы и команды</h3>\n<p><span class='en'>told / asked + кого + (not) to + глагол</span>.</p>\n<div class='ex'>«Don't touch» → <span class='en'>He told me not to touch it.</span> — <em>Он сказал мне не трогать.</em></div>\n"]}, {"id": "gerinf", "cat": "Грамматика", "title": "Gerund & Infinitive", "ru": "Герундий и инфинитив", "theory": ["\n<p>💡 <b>Суть:</b> когда в предложении два глагола подряд, второй принимает одну из двух форм: <b>с -ing</b> или <b>с to</b>. Какой именно — зависит от первого глагола. Это просто списки, которые привыкаешь чувствовать.</p>\n<h3>После этих — форма с -ing</h3>\n<p><span class='en'>enjoy, finish, avoid, mind, keep, practise</span> + и после любых предлогов (at, of, about...).</p>\n<div class='ex'><span class='en'>I enjoy reading.</span> — <em>Мне нравится читать.</em></div>\n<div class='ex'><span class='en'>good at cooking</span> — <em>хорош в готовке (после предлога — ing).</em></div>\n<h3>После этих — форма с to</h3>\n<p><span class='en'>want, decide, hope, promise, need, would like</span>.</p>\n<div class='ex'><span class='en'>She decided to leave.</span> — <em>Она решила уйти.</em></div>\n<h3>«Чтобы» — тоже to</h3>\n<div class='ex'><span class='en'>I came here to learn English.</span> — <em>Я пришёл сюда, ЧТОБЫ учить английский.</em></div>\n<p>👉 Самое частое на тесте: <span class='en'>enjoy/avoid/mind</span> → -ing; <span class='en'>want/decide/hope</span> → to.</p>\n"]}, {"id": "relative", "cat": "Грамматика", "title": "Relative Clauses", "ru": "Относительные придаточные", "theory": ["\n<p>💡 <b>Суть:</b> это слова-«скрепки» (who, which, that, where...), которыми приклеивают дополнительное описание к существительному. По-русски это «который / которая / где».</p>\n<ul>\n<li><code>who</code> — про людей (кто): <span class='en'>the man who called</span> — <em>человек, который звонил</em></li>\n<li><code>which</code> — про вещи (который): <span class='en'>the book which I read</span></li>\n<li><code>that</code> — заменяет who/which в простых случаях</li>\n<li><code>whose</code> — чей: <span class='en'>the woman whose car...</span> — <em>женщина, чья машина...</em></li>\n<li><code>where</code> — где (место), <code>when</code> — когда (время)</li>\n</ul>\n<div class='ex'><span class='en'>This is the house where I live.</span> — <em>Это дом, где я живу.</em></div>\n<p>👉 Человек → <code>who</code>. Вещь → <code>which</code>. Принадлежность (чей) → <code>whose</code>. Место → <code>where</code>.</p>\n"]}, {"id": "compar", "cat": "Грамматика", "title": "Comparatives", "ru": "Степени сравнения", "theory": ["\n<p>💡 <b>Суть:</b> сравниваем вещи: «больше / самый большой». Правило зависит только от <b>длины слова</b>.</p>\n<h3>Короткое слово (1 слог)</h3>\n<p>+<code>er</code> для сравнения, <code>the ...est</code> для «самый».</p>\n<div class='ex'><span class='en'>fast → faster → the fastest</span> — <em>быстрый → быстрее → самый быстрый</em></div>\n<h3>Длинное слово (2+ слога)</h3>\n<p><code>more</code> перед словом, <code>the most</code> для «самый».</p>\n<div class='ex'><span class='en'>interesting → more interesting → the most interesting</span></div>\n<h3>Надо запомнить (неправильные)</h3>\n<div class='ex'><span class='en'>good → better → the best</span> · <span class='en'>bad → worse → the worst</span></div>\n<h3>Полезные обороты</h3>\n<ul><li><span class='en'>as ... as</span> — такой же, как: <span class='en'>as fast as me</span></li>\n<li><span class='en'>too</span> — слишком; <span class='en'>enough</span> — достаточно: <span class='en'>too hot, old enough</span></li></ul>\n"]}, {"id": "quant", "cat": "Грамматика", "title": "Quantifiers", "ru": "Квантификаторы", "theory": ["\n<p>💡 <b>Суть:</b> слова «много / мало / несколько». Всё решает один вопрос: предмет <b>можно посчитать поштучно</b> или нет.</p>\n<p>Яблоки, друзья — <b>считаются</b> (1, 2, 3). Вода, деньги, время, информация — <b>не считаются</b> (нельзя «две воды»).</p>\n<h3>Много</h3>\n<ul><li><code>many</code> + то, что считается: <span class='en'>many people</span></li>\n<li><code>much</code> + то, что не считается: <span class='en'>much water</span> (чаще в вопросах/отрицаниях)</li>\n<li><code>a lot of</code> — подходит к обоим</li></ul>\n<h3>Мало / несколько</h3>\n<ul><li><code>a few</code> + считается: <span class='en'>a few friends</span> (несколько)</li>\n<li><code>a little</code> + не считается: <span class='en'>a little milk</span> (немного)</li></ul>\n<h3>some / any</h3>\n<p><code>some</code> — в утверждениях и просьбах; <code>any</code> — в вопросах и отрицаниях.</p>\n<div class='ex'><span class='en'>Would you like some tea? — No, there isn't any milk.</span></div>\n"]}, {"id": "wordform", "cat": "Лексика", "title": "Word Formation", "ru": "Словообразование", "theory": ["\n<p>💡 <b>Суть:</b> из одного слова делают другие, добавляя кусочки спереди (приставки) и сзади (суффиксы). На тесте надо понять, <b>какое слово по роли</b> нужно вставить, и подставить нужный кусочек.</p>\n<h3>Спереди — меняют смысл на противоположный</h3>\n<p><code>un-, in-, im-, dis-</code>: <span class='en'>happy → unhappy</span> (несчастный), <span class='en'>possible → impossible</span> (невозможный).</p>\n<h3>Сзади — меняют роль слова</h3>\n<ul><li>делаем «предмет/понятие»: <code>-tion, -ment, -ness</code> → <span class='en'>decide → decision, kind → kindness</span></li>\n<li>делаем «какой»: <code>-ful, -less, -able</code> → <span class='en'>care → careful</span> (заботливый) / <span class='en'>careless</span> (небрежный)</li>\n<li>делаем «как» (наречие): <code>-ly</code> → <span class='en'>quick → quickly</span></li></ul>\n<p>👉 <b>Приём:</b> посмотри на место пропуска. Нужен предмет? → ставь <code>-tion/-ness</code>. Описание? → <code>-ful/-less</code>. Как делается? → <code>-ly</code>.</p>\n"]}, {"id": "phrasal", "cat": "Лексика", "title": "Phrasal Verbs", "ru": "Фразовые глаголы", "theory": ["\n<p>💡 <b>Суть:</b> это глагол + маленькое слово (up, off, out...), и вместе они значат совсем не то, что по отдельности. <span class='en'>look</span> — смотреть, а <span class='en'>look after</span> — заботиться. Их учат как отдельные слова.</p>\n<p>Самые частые на тесте:</p>\n<ul>\n<li><span class='en'>look after</span> — заботиться</li>\n<li><span class='en'>look for</span> — искать</li>\n<li><span class='en'>look up</span> — искать (в словаре)</li>\n<li><span class='en'>give up</span> — бросить (привычку)</li>\n<li><span class='en'>put off</span> — отложить</li>\n<li><span class='en'>put up with</span> — терпеть</li>\n<li><span class='en'>take off</span> — снять / взлететь</li>\n<li><span class='en'>turn down</span> — убавить / отказать</li>\n<li><span class='en'>run out of</span> — закончиться</li>\n<li><span class='en'>break down</span> — сломаться</li>\n</ul>\n<div class='ex'><span class='en'>My car broke down.</span> — <em>Машина сломалась.</em></div>\n<p>👉 Не переводи по частям — запоминай целиком, как одно слово.</p>\n"]}, {"id": "collok", "cat": "Лексика", "title": "Collocations", "ru": "Устойчивые сочетания", "theory": ["\n<p>💡 <b>Суть:</b> некоторые слова «дружат» только с определёнными. По-русски говорим «сделать ошибку», а в английском надо знать, какой именно глагол берут — иначе звучит коряво. Это просто устойчивые пары.</p>\n<h3>make или do?</h3>\n<ul><li><code>make</code> — когда что-то создаёшь, производишь результат: <span class='en'>make a mistake, make a decision, make money</span></li>\n<li><code>do</code> — когда просто выполняешь дело/работу: <span class='en'>do homework, do the shopping, do a favour</span></li></ul>\n<div class='ex'><span class='en'>He made a mistake.</span> — <em>Он сделал ошибку.</em> · <span class='en'>She did her homework.</span> — <em>Она сделала домашку.</em></div>\n<h3>Другие частые пары</h3>\n<ul><li><span class='en'>take a photo / a break / a shower</span></li>\n<li><span class='en'>have a good time / breakfast</span></li>\n<li><span class='en'>pay attention</span> — обращать внимание</li></ul>\n<p>👉 Эти пары заучивают целиком — логики мало, зато их немного.</p>\n"]}];

function load(){try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}

function today(){return new Date().toISOString().slice(0,10);}
function bumpStreak(){
  const t=today();if(S.streak.last===t)return;
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);
  S.streak.count=(S.streak.last===y)?(S.streak.count+1):1;
  S.streak.last=t;save();
}
function recordAnswer(id,correct){
  const r=S.res[id]||{s:0,c:0,w:0};r.s++;correct?r.c++:r.w++;r.l=correct;S.res[id]=r;
  const mi=S.mistakes.indexOf(id);
  if(correct){if(mi>=0)S.mistakes.splice(mi,1);}else{if(mi<0)S.mistakes.push(id);}
  bumpStreak();save();
}
function topicMastery(tid){
  const list=QBY[tid]||[];let att=0,cor=0;
  list.forEach(q=>{const r=S.res[q.id];if(r&&r.s){att++;if(r.l)cor++;}});
  return{att,total:list.length,pct:att?Math.round(cor/att*100):0,seen:att};
}
function overall(){
  let seen=0,cor=0;Object.values(S.res).forEach(r=>{seen+=r.s;cor+=r.c;});
  return{answered:seen,correct:cor,acc:seen?Math.round(cor/seen*100):0};
}

function startPractice(list,title,backHash){
  list=shuffle(list);let i=0,answered=false,correctCount=0;
  function draw(){
    answered=false;const q=list[i];const opts=q.o.map((o,k)=>({o,k}));
    app.innerHTML=`<div class="view">
      <div class="quiz-head">
        <button class="back" data-back>‹ ${esc(title)}</button>
      </div>
      <div class="quiz-head">
        <div class="progress-line"><i style="width:${i/list.length*100}%"></i></div>
        <span class="qcount">${i+1} / ${list.length}</span>
      </div>
      <div class="card qcard">
        <div class="qmeta"><span class="pill ${TBYID[q.t]&&TBYID[q.t].cat==="Лексика"?"gold":""}">${TBYID[q.t]?TBYID[q.t].title:""}</span></div>
        <p class="qtext">${gapize(q.q)}</p>
        <div class="opts">${opts.map(({o,k})=>`<button class="opt" data-k="${k}"><span class="letter">${LETTERS[k]}</span><span>${esc(o)}</span><span class="mark"></span></button>`).join("")}</div>
        <div class="explain"><div class="et"></div><div class="ex-body"></div></div>
      </div>
      <div class="quiz-foot">
        <button class="btn block" data-next disabled>${i+1<list.length?"Следующий вопрос":"Завершить"}</button>
      </div>
    </div>`;
    $("[data-back]").onclick=()=>{location.hash=backHash;};
    const exp=$(".explain"),nextBtn=$("[data-next]");
    app.querySelectorAll(".opt").forEach(btn=>{
      btn.onclick=()=>{
        if(answered)return;answered=true;const k=+btn.dataset.k;const ok=k===q.a;
        if(ok)correctCount++;
        recordAnswer(q.id,ok);
        app.querySelectorAll(".opt").forEach(b=>{
          b.disabled=true;const bk=+b.dataset.k;
          if(bk===q.a)b.classList.add("correct"),$(".mark",b).textContent="✓";
          else if(bk===k)b.classList.add("wrong"),$(".mark",b).textContent="✗";
        });
        exp.classList.add("show",ok?"ok":"no");
        $(".et",exp).textContent=ok?"Верно":"Ошибка";
        $(".ex-body",exp).innerHTML=esc(q.e);
        nextBtn.disabled=false;
      };
    });
    nextBtn.onclick=()=>{if(!answered)return;i++;i<list.length?draw():finish();};
  }
  function finish(){
    const pct=Math.round(correctCount/list.length*100);
    app.innerHTML=`<div class="view">
      <div class="card result-score">
        <div class="big">${correctCount}<span class="outof">/${list.length}</span></div>
        <div style="color:var(--muted);margin-top:4px">${esc(title)}</div>
        <div class="verdict ${pct>=70?"pass":"fail"}">${pct}% правильных</div>
      </div>
      <div class="quiz-foot">
        <button class="btn ghost block" data-again>Ещё раз</button>
        <button class="btn block" data-done>Готово</button>
      </div>
    </div>`;
    $("[data-again]").onclick=()=>startPractice(list,title,backHash);
    $("[data-done]").onclick=()=>{location.hash=backHash;};
  }
  draw();
}

function startExam(){
  const pool=shuffle(Q).slice(0,Math.min(EXAM_N,Q.length));
  const answers=new Array(pool.length).fill(null);
  let cur=0,left=EXAM_MIN*60;
  function fmt(s){const m=Math.floor(s/60),x=s%60;return m+":"+String(x).padStart(2,"0");}
  function drawQ(){
    const q=pool[cur];
    app.innerHTML=`<div class="view">
      <div class="exam-bar">
        <button class="back" data-quit>‹ Выйти</button>
        <span class="timer" id="tmr">⏱ ${fmt(left)}</span>
        <span class="qcount" style="margin-left:auto">${cur+1} / ${pool.length}</span>
      </div>
      <div class="progress-line" style="margin-bottom:14px"><i style="width:${(answers.filter(a=>a!==null).length)/pool.length*100}%"></i></div>
      <div class="card qcard">
        <div class="qmeta"><span class="pill ${TBYID[q.t]&&TBYID[q.t].cat==="Лексика"?"gold":""}">${TBYID[q.t]?TBYID[q.t].title:""}</span></div>
        <p class="qtext">${gapize(q.q)}</p>
        <div class="opts">${q.o.map((o,k)=>`<button class="opt${answers[cur]===k?" chosen":""}" data-k="${k}"><span class="letter">${LETTERS[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>
      </div>
      <div class="quiz-foot">
        <button class="btn ghost" data-prev ${cur===0?"disabled":""}>‹ Назад</button>
        ${cur+1<pool.length?'<button class="btn block" data-nx>Далее ›</button>':'<button class="btn block gold" data-submit>Завершить ›</button>'}
      </div>
      <div class="section-label">Навигатор</div>
      <div class="navgrid">${pool.map((_,k)=>`<button class="navg${answers[k]!==null?" done":""}${k===cur?" cur":""}" data-g="${k}">${k+1}</button>`).join("")}</div>
    </div>`;
    $("[data-quit]").onclick=()=>{if(confirmLeave()){stopTimer();location.hash="exam";}};
    app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{answers[cur]=+b.dataset.k;
      app.querySelectorAll(".opt").forEach(x=>x.classList.remove("chosen"));b.classList.add("chosen");
      $(".navgrid [data-g='"+cur+"']").classList.add("done");
      $(".progress-line i").style.width=(answers.filter(a=>a!==null).length)/pool.length*100+"%";});
    const pv=$("[data-prev]");if(pv)pv.onclick=()=>{cur--;drawQ();};
    const nx=$("[data-nx]");if(nx)nx.onclick=()=>{cur++;drawQ();};
    const sb=$("[data-submit]");if(sb)sb.onclick=()=>submit();
    app.querySelectorAll(".navg").forEach(b=>b.onclick=()=>{cur=+b.dataset.g;drawQ();});
  }
  function confirmLeave(){return true;}
  function tick(){left--;const t=$("#tmr");if(t){t.textContent="⏱ "+fmt(left);if(left<=60)t.classList.add("warn");}if(left<=0){submit();}}
  function stopTimer(){if(examTimer){clearInterval(examTimer);examTimer=null;}}
  function submit(){
    stopTimer();let score=0;const byTopic={};
    pool.forEach((q,k)=>{const ok=answers[k]===q.a;if(ok)score++;recordAnswer(q.id,answers[k]!==null?ok:false);
      const cat=TBYID[q.t]?TBYID[q.t].title:"—";byTopic[cat]=byTopic[cat]||{c:0,t:0};byTopic[cat].t++;if(ok)byTopic[cat].c++;});
    S.exams.push({date:today(),score,total:pool.length});save();
    const pass=score>=25;
    app.innerHTML=`<div class="view">
      <div class="card result-score">
        <div class="big" style="color:${pass?"var(--good)":"var(--bad)"}">${score}<span class="outof">/${pool.length}</span></div>
        <div class="verdict ${pass?"pass":"fail"}">${pass?"Порог пройден (≥25)":"Ниже порога (нужно 25)"}</div>
        <div style="color:var(--muted);margin-top:8px;font-size:13px">Правильность: ${Math.round(score/pool.length*100)}%</div>
      </div>
      <div class="section-label">Разбор по темам</div>
      <div class="mini-list">${Object.entries(byTopic).sort((a,b)=>a[1].c/a[1].t-b[1].c/b[1].t).map(([k,v])=>`<div class="mini"><span style="min-width:0">${esc(k)}</span><span class="d" style="margin-left:auto;color:${v.c/v.t>=0.6?"var(--good)":"var(--bad)"}">${v.c}/${v.t}</span></div>`).join("")}</div>
      <div class="quiz-foot" style="margin-top:18px">
        <button class="btn ghost block" data-review>Разбор ответов</button>
        <button class="btn block" data-done>Готово</button>
      </div>
    </div>`;
    $("[data-done]").onclick=()=>{location.hash="exam";};
    $("[data-review]").onclick=()=>reviewExam(pool,answers);
  }
  examTimer=setInterval(tick,1000);
  drawQ();
}

function reviewExam(pool,answers){
  app.innerHTML=`<div class="view">
    <div class="quiz-head"><button class="back" data-back>‹ Результат</button></div>
    <h1 class="page-title" style="font-size:20px">Разбор ответов</h1>
    <div class="grid" style="gap:10px;margin-top:8px">
    ${pool.map((q,k)=>{const ok=answers[k]===q.a;return `<div class="card pad">
      <div class="qmeta"><span class="pill ${ok?"":"gold"}" style="${ok?"background:var(--good-soft);color:var(--good)":"background:var(--bad-soft);color:var(--bad)"}">${ok?"верно":"ошибка"}</span><span style="color:var(--muted);font-size:12px">${TBYID[q.t]?TBYID[q.t].title:""}</span></div>
      <p style="font-weight:600;margin:0 0 8px">${gapize(q.q)}</p>
      <div style="font-size:14px;line-height:1.7">

        <div style="color:var(--good)">Правильно: ${esc(q.o[q.a])}</div>

      </div></div>`;}).join("")}

    <div class="quiz-foot"><button class="btn block" data-done>Готово</button></div>
  </div>`;
  $("[data-back]").onclick=()=>{location.hash="exam";};
  $("[data-done]").onclick=()=>{location.hash="exam";};
}

  if(t)document.documentElement.setAttribute("data-theme",t);
  else document.documentElement.removeAttribute("data-theme");
  const dark=t?t==="dark":window.matchMedia("(prefers-color-scheme:dark)").matches;
  $("#themeBtn").innerHTML=dark
    ?'<svg viewBox="0 0 24 24" width="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4 12H2M22 12h-2M5 5l1.5 1.5M17.5 17.5 19 19M19 5l-1.5 1.5M6.5 17.5 5 19"/></svg>'
    :'<svg viewBox="0 0 24 24" width="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>';
}
$("#themeBtn").onclick=()=>{
  const dark=S.theme?S.theme==="dark":window.matchMedia("(prefers-color-scheme:dark)").matches;
  S.theme=dark?"light":"dark";save();applyTheme();
};
function refreshStreak(){$("#streakN").textContent=S.streak.count||0;}

applyTheme();refreshStreak();route2();
</script>
